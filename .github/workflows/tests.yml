name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      # downloads the NSL-KDD data from its public mirror on first run
      - run: python tests/test_constraints.py
